<!DOCTYPE html>
<html lang="it-IT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSVP DEBUG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-gradient" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 50px 20px;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-lg border-0" style="background: rgba(0,0,0,0.8);">
          <div class="card-body p-5 text-white">
            <h1 class="text-center mb-4">🔍 RSVP DEBUG MODE</h1>
            
            <div id="debug-info" class="mb-4 p-3 bg-dark rounded">
              <h5>📋 INFO DEBUG:</h5>
              <div id="url-info"></div>
              <div id="phone-info"></div>
            </div>
            
            <div id="loading" class="text-center py-5">
              <div class="spinner-border text-light mb-3" style="width: 3rem; height: 3rem;"></div>
              <p class="h5" id="loading-text">Inizio debug...</p>
            </div>
            
            <div id="results" style="display:none;"></div>
            <div id="error" style="display:none;" class="alert alert-danger"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1156skXZ20-rRUNHlLzlPP5zGvhXjdhQ1YfmBn-sAssU';
    const API_KEY = 'AIzaSyBAm-BeIXXGFRh1208WGvwxCyE0OICQmJ0';
    const SHEET_NAME = 'sposa';

    // DEBUG COMPLETO
    document.addEventListener('DOMContentLoaded', async function() {
      const urlInfo = document.getElementById('url-info');
      const phoneInfo = document.getElementById('phone-info');
      const loading = document.getElementById('loading');
      const loadingText = document.getElementById('loading-text');
      const results = document.getElementById('results');
      const errorDiv = document.getElementById('error');
      
      // 1. INFO URL
      const urlParams = new URLSearchParams(window.location.search);
      const phone = urlParams.get('id');
      const hash = window.location.hash;
      
      urlInfo.innerHTML = `<strong>URL:</strong> ${window.location.href}`;
      phoneInfo.innerHTML = `
        <strong>Hash:</strong> ${hash}<br>
        <strong>Phone ID:</strong> ${phone || '❌ MANCANTE'}<br>
        <strong>Testa con:</strong> ?id=32897643
      `;
      
      if (!phone) {
        showError('❌ NESSUN ID! Usa: https://tuosito.it/?id=32897643#rsvp');
        return;
      }
      
      if (hash !== '#rsvp') {
        showError('❌ Usa #rsvp nel link!');
        return;
      }
      
      // 2. TEST API
      loadingText.textContent = '🔄 Test API Google Sheets...';
      try {
        const apiUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${SHEET_NAME}?key=${API_KEY}`;
        console.log('🌐 API URL:', apiUrl);
        
        const response = await fetch(apiUrl);
        console.log('📡 Response:', response.status, response.statusText);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        console.log('✅ DATI:', data);
        
        loadingText.textContent = `📊 Dati OK! ${data.values?.length || 0} righe`;
        
        // 3. CERCA TELEFONO
        const family = [];
        const headers = data.values[0];
        const rows = data.values.slice(1);
        
        console.log('🔍 Headers:', headers);
        console.log('🔍 Cerco telefono:', phone);
        
        rows.forEach((row, index) => {
          if (row[2] && row[2].toString().trim() === phone) {
            console.log('✅ TROVATO!', row);
            family.push({
              row: index + 2,
               row,
              name: row[0],
              surname: row[1],
              phone: row[2]
            });
          }
        });
        
        console.log('👨‍👩‍👧‍👦 Famiglia:', family);
        
        if (family.length > 0) {
          showResults(family, data.values);
        } else {
          showError(`❌ Nessun match per ${phone}<br><strong>Telefoni nel sheet:</strong><br>` + 
                   rows.slice(0,5).map(r => r[2]).join('<br>'));
        }
        
      } catch (err) {
        console.error('💥 ERRORE:', err);
        showError(err.message);
      }
      
      function showError(msg) {
        loading.style.display = 'none';
        errorDiv.innerHTML = `<h5>❌ ${msg}</h5><button class="btn btn-warning mt-2" onclick="location.reload()">🔄 Riprova</button>`;
        errorDiv.style.display = 'block';
      }
      
      function showResults(family, allData) {
        loading.style.display = 'none';
        results.style.display = 'block';
        results.innerHTML = `
          <div class="alert alert-success">
            <h5>✅ TROVATO ${family.length} match!</h5>
            ${family.map(f => `
              <div class="p-3 bg-light text-dark rounded mt-2">
                <strong>${f.name} ${f.surname}</strong><br>
                📱 ${f.phone} | Riga ${f.row}
              </div>
            `).join('')}
          </div>
          <h6>Tutti i telefoni nel sheet (prime 10 righe):</h6>
          <pre class="bg-dark text-white p-3 rounded small">${allData.slice(1,11).map(r => r[2]).join('\n')}</pre>
        `;
      }
    });
  </script>
</body>
</html>
